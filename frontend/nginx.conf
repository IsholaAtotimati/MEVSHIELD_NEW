# nginx configuration for the MEVShield single-page app.
#
# Two jobs:
#   1. Serve the Vite build output.
#   2. SPA fallback: react-router handles /trade, /portfolio, /activity,
#      /policies and /network client-side, so a direct request for any of those
#      paths must return index.html rather than a 404.
#
# Listens on 8080 so the container can run as the unprivileged `nginx` user.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Unprivileged nginx needs writable temp paths. These are created and owned
    # by the nginx user in the Dockerfile.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # The container's own health endpoint. Handled before the SPA fallback so a
    # probe never depends on the bundle loading.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed asset filenames are immutable, so they can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html must never be cached, otherwise a browser can keep a stale
    # bundle that points at old contract addresses after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback. Any path that is not a real file resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline hardening. The app needs no inline scripts beyond what Vite
    # emits, no framing, and no referrer leakage to other origins.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Compression for the JS and CSS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
